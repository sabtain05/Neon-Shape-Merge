    <title>Neon Shape-Merge</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0f1e;
            overflow: hidden;
            touch-action: none;
            position: fixed;
        }
        canvas.emscripten {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #0a0f1e;
            object-fit: contain;
            outline: none;
        }
    </style>
</head>
<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
        var Module = {
            canvas: (function() {
                return document.getElementById('canvas');
            })()
        };
    </script>
