<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Neon Shape-Merge</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%230ff' stroke-width='6' opacity='0.4'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%230ff'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #0a0f1e;
            overflow: hidden;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            position: fixed;
            inset: 0;
        }
        canvas.emscripten {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #0a0f1e;
            outline: none;
            display: block;
        }
        #safe-area-probe {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            bottom: env(safe-area-inset-bottom, 0px);
            left: 0;
            right: 0;
            pointer-events: none;
            visibility: hidden;
        }
    </style>
</head>
<body>
    <div id="safe-area-probe"></div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
        const DB_URL = "https://neonshapemerge-default-rtdb.firebaseio.com";
        
        window.globalTotalPlayers = 0;
        window.globalRecentPlayers = ["Loading...", "", "", "", ""];
        window.hasRegistered = false;
        window.safeInsetTop = 0;
        window.safeInsetBottom = 0;

        function updateSafeAreaInsets() {
            const probe = document.getElementById('safe-area-probe');
            if (!probe) return;
            const rect = probe.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            window.safeInsetTop = Math.max(0, rect.top) * dpr;
            window.safeInsetBottom = Math.max(0, window.innerHeight - rect.bottom) * dpr;
        }
        window.addEventListener('resize', updateSafeAreaInsets);
        window.addEventListener('orientationchange', () => setTimeout(updateSafeAreaInsets, 150));
        updateSafeAreaInsets();

        window.fetchPlayerData = async function() {
            try {
                let res = await fetch(DB_URL + "/players.json");
                let data = await res.json();
                if (data) {
                    let keys = Object.keys(data);
                    window.globalTotalPlayers = keys.length;
                    let recent = [];
                    for (let i = keys.length - 1; i >= Math.max(0, keys.length - 5); i--) {
                        recent.push(data[keys[i]].name);
                    }
                    while (recent.length < 5) recent.push("");
                    window.globalRecentPlayers = recent;
                }
            } catch (e) {
                console.error("Firebase fetch error:", e);
            }
        };

        window.registerPlayer = async function(playerName) {
            if (window.hasRegistered) return;
            window.hasRegistered = true;
            try {
                await fetch(DB_URL + "/players.json", {
                    method: "POST",
                    body: JSON.stringify({ name: playerName, time: Date.now() })
                });
                window.fetchPlayerData();
            } catch (e) {}
        };

        (function() {
            const canvas = document.getElementById('canvas');
            const origGetContext = canvas.getContext.bind(canvas);
            canvas.getContext = function(type, attrs) {
                if (type === 'webgl' || type === 'webgl2' || type === 'experimental-webgl') {
                    attrs = Object.assign({}, attrs, {
                        failIfMajorPerformanceCaveat: false,
                        antialias: false,
                        preserveDrawingBuffer: true
                    });
                }
                const ctx = origGetContext(type, attrs);
                if (!ctx && (type === 'webgl' || type === 'webgl2')) {
                    document.body.innerHTML = '<div style="color:#0ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;margin-top:20%;padding:20px;"><h2>WebGL Unavailable</h2><p style="color:#fff;">Your browser or cloud VM has hardware acceleration & WebGL disabled.</p></div>';
                }
                return ctx;
            };
        })();

        var Module = {
            preRun: [],
            postRun: [],
            canvas: document.getElementById('canvas'),
            onRuntimeInitialized: function() {
                updateSafeAreaInsets();
                setTimeout(() => {
                    let name = prompt("Enter your username for the global network:", "Guest_" + Math.floor(Math.random()*1000));
                    if (!name || name.trim() === "") name = "Anonymous";
                    window.registerPlayer(name.trim().substring(0, 15)); 
                    
                    setInterval(window.fetchPlayerData, 5000);
                    window.fetchPlayerData();
                }, 500);
            }
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
