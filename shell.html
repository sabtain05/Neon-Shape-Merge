<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Shape-Merge</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='%230ff' stroke-width='6' opacity='0.4'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%230ff'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0f1e;
            overflow: hidden;
            touch-action: none;
            position: fixed;
        }
        canvas.emscripten {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background-color: #0a0f1e;
            object-fit: contain;
            outline: none;
        }
    </style>
</head>
<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
        var Module = {
            canvas: (function() {
                return document.getElementById('canvas');
            })()
        };
    </script>
    <script>
        const DB_URL = "https://neonshapemerge-default-rtdb.firebaseio.com/";
        
        window.globalTotalPlayers = 0;
        window.globalRecentPlayers = ["Loading...", "", "", "", ""];
        window.hasRegistered = false;

        window.fetchPlayerData = async function() {
            try {
                let res = await fetch(DB_URL + "/players.json");
                let data = await res.json();
                if (data) {
                    let keys = Object.keys(data);
                    window.globalTotalPlayers = keys.length;
                    
                    let recent = [];
                    for (let i = keys.length - 1; i >= Math.max(0, keys.length - 5); i--) {
                        recent.push(data[keys[i]].name);
                    }
                    while (recent.length < 5) recent.push("");
                    window.globalRecentPlayers = recent;
                }
            } catch (e) {
                console.error("Firebase fetch error:", e);
            }
        };

        window.registerPlayer = async function(playerName) {
            if (window.hasRegistered) return;
            window.hasRegistered = true;
            try {
                await fetch(DB_URL + "/players.json", {
                    method: "POST",
                    body: JSON.stringify({ name: playerName, time: Date.now() })
                });
                window.fetchPlayerData();
            } catch (e) {}
        };

        window.onload = () => {
            setTimeout(() => {
                let name = prompt("Enter your username for the global network:", "Guest_" + Math.floor(Math.random()*1000));
                if (!name || name.trim() === "") name = "Anonymous";
                window.registerPlayer(name.trim().substring(0, 15)); 
                setInterval(window.fetchPlayerData, 5000);
                window.fetchPlayerData();
            }, 1000);
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
